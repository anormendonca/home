<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anor Mendonca — Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="outer-frame">
    <!-- Category Pill -->
    <div class="tag-container">
      <div class="pill-tag">
        <span class="dot"></span>
        004 • Case Studies
      </div>
    </div>

    <!-- Main Title -->
    <h1 class="main-heading">What We’ve Built</h1>

    <!-- Carousel Section -->
    <div class="carousel-stage">
      <button class="nav-arrow prev" id="prevBtn" aria-label="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <div class="deck-container" id="deck"></div>

      <button class="nav-arrow next" id="nextBtn" aria-label="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <!-- Pagination Dots -->
    <div class="pagination-dots" id="dotsContainer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
